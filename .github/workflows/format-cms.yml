name: format-cms

on:
  push:
    branches: [main]
    paths: [apps/web/src/pages/works/model/works.json]

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '(via Pages CMS)')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - uses: pnpm/setup@v3
        with:
          require-lockfile: true
      - run: pnpm exec vp fmt apps/web/src/pages/works/model/works.json
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: Pages CMS が保存した works.json を整形する"
          file_pattern: apps/web/src/pages/works/model/works.json
