name: format-cms

on:
  push:
    branches: [main]
    paths: [apps/web/src/pages/works/model/works.json]

permissions: {}

jobs:
  format:
    if: contains(github.event.head_commit.message, '(via Pages CMS)')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - run: vp fmt apps/web/src/pages/works/model/works.json
      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "style: Pages CMS が保存した works.json を整形する"
          file_pattern: apps/web/src/pages/works/model/works.json
